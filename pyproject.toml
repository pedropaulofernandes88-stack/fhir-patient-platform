[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-patient-platform"
version = "0.1.0"
description = "FHIR R4 patient data platform with auditable synthetic records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pedropaulofernandes88-stack" }]
dependencies = [
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<1.0",
  "pandas>=2.3,<3.0",
  "pydantic>=2.13,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "streamlit>=1.62,<2.0",
  "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "ruff>=0.16,<1.0",
]
postgres = [
  "psycopg[binary]>=3.3,<4.0",
]

[project.scripts]
fhir-platform-api = "fhir_patient_platform.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
